name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require explicit release authorization on current main
        id: release_authorization
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git fetch origin main --depth=1
          MAIN_SHA="$(git rev-parse origin/main)"
          python tools/validate_release_authorization.py \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --main-sha "$MAIN_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Install test dependencies
        run: python -m pip install pytest jsonschema bpy==5.2.1
      - name: Validate source
        run: pytest -q
      - name: Validate Blender 5.2.1 RNA lifecycle
        run: python tests/test_blender_runtime_52.py
      - name: Check ExtendScript syntax
        run: |
          cp apps/after-effects/CutBridge.jsx /tmp/CutBridge.js
          node --check /tmp/CutBridge.js
      - name: Build versioned packages
        run: python tools/build_release.py --tag "${GITHUB_REF_NAME}" --output dist
      - name: Verify release checksums
        run: cd dist && sha256sum --check SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.release_authorization.outputs.prerelease }}
          files: |
            dist/CutBridge-Blender-*.zip
            dist/CutBridge-AfterEffects-*.zip
            dist/SHA256SUMS.txt
            dist/release-metadata.json
          generate_release_notes: true
