name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require explicit release authorization on current main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git fetch origin main --depth=1
          MAIN_SHA="$(git rev-parse origin/main)"
          python tools/validate_release_authorization.py \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --main-sha "$MAIN_SHA"
      - name: Install test dependencies
        run: python -m pip install pytest jsonschema bpy==5.2.1
      - name: Validate source
        run: pytest -q
      - name: Validate Blender 5.2.1 RNA lifecycle
        run: python tests/test_blender_runtime_52.py
      - name: Check ExtendScript syntax
        run: |
          cp apps/after-effects/CutBridge.jsx /tmp/CutBridge.js
          node --check /tmp/CutBridge.js
      - name: Build versioned packages
        run: python tools/build_release.py --tag "${GITHUB_REF_NAME}" --output dist
      - name: Verify release checksums
        run: cd dist && sha256sum --check SHA256SUMS.txt
      - name: Upload validated release bundle
        uses: actions/upload-artifact@v4
        with:
          name: cutbridge-release-${{ github.ref_name }}
          path: |
            dist/CutBridge-Blender-*.zip
            dist/CutBridge-AfterEffects-*.zip
            dist/SHA256SUMS.txt
            dist/release-metadata.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Revalidate release authorization on current main
        id: release_authorization
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git fetch origin main --depth=1
          MAIN_SHA="$(git rev-parse origin/main)"
          python tools/validate_release_authorization.py \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --main-sha "$MAIN_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Download validated release bundle
        uses: actions/download-artifact@v4
        with:
          name: cutbridge-release-${{ github.ref_name }}
          path: dist
      - name: Revalidate downloaded release bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_CHANNEL: ${{ steps.release_authorization.outputs.channel }}
          EXPECTED_PRERELEASE: ${{ steps.release_authorization.outputs.prerelease }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS.txt)
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path("dist/release-metadata.json").read_text(encoding="utf-8"))
          expected_prerelease = os.environ["EXPECTED_PRERELEASE"] == "true"
          if metadata.get("tag") != os.environ["RELEASE_TAG"]:
              raise SystemExit("Downloaded release metadata tag does not match the triggering tag.")
          if metadata.get("channel") != os.environ["EXPECTED_CHANNEL"]:
              raise SystemExit("Downloaded release metadata channel does not match authorization.")
          if metadata.get("prerelease") is not expected_prerelease:
              raise SystemExit("Downloaded release metadata prerelease state does not match authorization.")
          PY
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.release_authorization.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            dist/CutBridge-Blender-*.zip
            dist/CutBridge-AfterEffects-*.zip
            dist/SHA256SUMS.txt
            dist/release-metadata.json
          generate_release_notes: true
