name: Beta2 AE UI Repair Orchestrator

on:
  push:
    branches: ['build/beta2-ae-ui-repair']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/beta2-line-preflight-ux
          fetch-depth: 0
          persist-credentials: true

      - name: Patch AE panel UX without rewriting unrelated logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/after-effects/CutBridge.jsx')
          source = path.read_text(encoding='utf-8')
          start_marker = '    function packageStatusText(manifest) {'
          end_marker = '    CutBridgeContract.loadManifest = loadManifest;'
          start = source.index(start_marker)
          end = source.index(end_marker, start)

          new_block = r'''    function packageStatusText(manifest) {
              if (!manifest) return tr("no_package");
              return tr("package_status", {name: manifest.package_name || manifest.cut, fps: manifest.fps, frames: manifest.frames.count});
          }

          function aeUiText(key) {
              var copy = {
                  EN: {
                      package_section: "Package",
                      actions_section: "Workflow",
                      package_label: "Package",
                      status_label: "Status",
                      status_ready: "READY",
                      status_warning: "WARNING",
                      status_error: "ERROR",
                      none: "None",
                      status_load_prompt: "Load a Blender-generated cutbridge.json to begin.",
                      status_package_loaded: "Package loaded. Review the package details, then Build or run QC.",
                      status_build_complete: "Build completed. Continue compositing, then run QC+ before handoff.",
                      status_action_failed: "The last action failed. Read the CutBridge error, correct the cause, and retry.",
                      status_qc_pass: "QC+ passed for the inspected scope.",
                      status_qc_warning: "QC+ found warnings. Review them before continuing.",
                      status_qc_error: "QC+ found blocking errors. Fix them before continuing.",
                      status_revision_complete: "Revision updated. Artist-owned work should remain preserved by the revision contract.",
                      desc_load: "Choose the cutbridge.json created by Blender. Loading reads package metadata; it does not build or modify the AE project.",
                      desc_build: "Create or safely reuse CutBridge-managed folders, footage, layers, and the comp from the loaded package.",
                      desc_qc: "Inspect package files, sequences, managed ownership, and comp consistency without rebuilding the project.",
                      desc_revision: "Move to a compatible newer package version while preserving artist-owned effects, masks, layers, and supported properties.",
                      help_what: "What",
                      help_when: "When to use it",
                      help_recommended: "Recommended",
                      help_limits: "Limitations",
                      help_load_title: "Load Package",
                      help_load_what: "Reads the Blender-generated cutbridge.json and prepares CutBridge to work with that package.",
                      help_load_when: "Use this first when opening a package or switching to a different cut.",
                      help_load_recommended: "Load the exact cutbridge.json from the package you intend to composite.",
                      help_load_limits: "Loading alone does not import footage, create comps, or alter artist layers.",
                      help_build_title: "Build",
                      help_build_what: "Creates or safely reuses the deterministic CutBridge-managed AE structure for the loaded package.",
                      help_build_when: "Use after loading a valid package and after the required render sequences are available.",
                      help_build_recommended: "Build once, then continue normal compositing inside the managed comp while keeping artist work separate from managed ownership.",
                      help_build_limits: "Build will not guess unsafe paths or silently adopt ambiguous managed objects. Blocking errors must be resolved first.",
                      help_qc_title: "QC+",
                      help_qc_what: "Checks package identity, sequence completeness, managed ownership, and comp settings without creating replacement objects.",
                      help_qc_when: "Run after Build, before handoff, and again after important revisions.",
                      help_qc_recommended: "Treat ERROR as blocking. Review WARNING before delivery. Keep CBQ support codes when reporting a problem.",
                      help_qc_limits: "QC+ reports problems; it intentionally does not auto-repair ambiguous ownership or missing production content.",
                      help_revision_title: "Revision",
                      help_revision_what: "Updates compatible CutBridge-managed sources and metadata from a newer package version.",
                      help_revision_when: "Use for a normal V001 -> V002 -> V003 source update after the newer Blender package has been generated.",
                      help_revision_recommended: "Save the AE project first, select the newer package, review warnings, and confirm only when the revision is expected.",
                      help_revision_limits: "Unsupported FPS, resolution, duration, pass-set, or ownership changes are blocked or require deliberate rebuild/migration."
                  },
                  JA: {
                      package_section: "パッケージ",
                      actions_section: "ワークフロー",
                      package_label: "パッケージ",
                      status_label: "状態",
                      status_ready: "準備完了 / READY",
                      status_warning: "警告 / WARNING",
                      status_error: "エラー / ERROR",
                      none: "なし",
                      status_load_prompt: "Blenderで生成したcutbridge.jsonを読み込んで開始してください。",
                      status_package_loaded: "パッケージを読み込みました。内容を確認してからBuildまたはQC+を実行してください。",
                      status_build_complete: "Buildが完了しました。コンポジット作業後、受け渡し前にQC+を実行してください。",
                      status_action_failed: "直前の処理に失敗しました。CutBridgeのエラー内容を確認し、原因を修正して再実行してください。",
                      status_qc_pass: "確認した範囲でQC+はPASSです。",
                      status_qc_warning: "QC+で警告があります。続行前に内容を確認してください。",
                      status_qc_error: "QC+で停止が必要なエラーがあります。続行前に修正してください。",
                      status_revision_complete: "差し替えが完了しました。Revision契約の範囲でアーティスト作業は保持されます。",
                      desc_load: "Blenderで生成したcutbridge.jsonを選択します。読み込みだけではAEプロジェクトのBuildや変更は行いません。",
                      desc_build: "読み込んだパッケージからCutBridge管理フォルダー、フッテージ、レイヤー、コンポを作成または安全に再利用します。",
                      desc_qc: "再構築せずに、パッケージ、連番、管理所有権、コンポ設定の整合性を確認します。",
                      desc_revision: "互換性のある新しいパッケージへ差し替え、対応範囲のエフェクト、マスク、手動レイヤーなどアーティスト作業を保持します。",
                      help_what: "機能",
                      help_when: "使用タイミング",
                      help_recommended: "推奨",
                      help_limits: "制限",
                      help_load_title: "パッケージ読み込み",
                      help_load_what: "Blenderで生成したcutbridge.jsonを読み込み、CutBridgeが対象パッケージを扱える状態にします。",
                      help_load_when: "パッケージを初めて開く時、または別のカットへ切り替える時に最初に使用します。",
                      help_load_recommended: "コンポジット対象のパッケージ内にある正しいcutbridge.jsonを選択してください。",
                      help_load_limits: "読み込みだけではフッテージのImport、コンポ作成、アーティストレイヤーの変更は行いません。",
                      help_build_title: "Build",
                      help_build_what: "読み込んだパッケージ用のCutBridge管理AE構造を作成、または安全に再利用します。",
                      help_build_when: "有効なパッケージを読み込み、必要なレンダー連番が準備できた後に使用します。",
                      help_build_recommended: "Build後は管理コンポ内で通常のコンポジット作業を行い、アーティスト作業とCutBridge管理対象を分けてください。",
                      help_build_limits: "危険なパスや所有権が曖昧な管理オブジェクトを推測して採用しません。停止エラーは先に解決してください。",
                      help_qc_title: "QC+",
                      help_qc_what: "パッケージID、連番の完全性、管理所有権、コンポ設定を確認し、代替オブジェクトは自動作成しません。",
                      help_qc_when: "Build後、受け渡し前、重要な差し替え後に実行してください。",
                      help_qc_recommended: "ERRORは停止、WARNINGは納品前に確認してください。問題報告時はCBQサポートコードを残してください。",
                      help_qc_limits: "QC+は問題を報告しますが、曖昧な所有権や不足した制作データを自動修復しません。",
                      help_revision_title: "差し替え / Revision",
                      help_revision_what: "互換性のある新しいパッケージからCutBridge管理ソースとメタデータを更新します。",
                      help_revision_when: "Blender側で新しいパッケージを生成した後、V001 -> V002 -> V003の通常差し替えで使用します。",
                      help_revision_recommended: "先にAEプロジェクトを保存し、新しいパッケージを選択して警告を確認し、意図した差し替えの場合のみ確定してください。",
                      help_revision_limits: "FPS、解像度、尺、パス構成、所有権など非対応の変更は停止されるか、明示的な再構築/移行が必要です。"
                  }
              };
              var lang = currentLocale === "JA" ? "JA" : "EN";
              return copy[lang][key] || copy.EN[key] || key;
          }

          function aeHelpCopy(topic) {
              var prefix = "help_" + topic + "_";
              return {
                  title: aeUiText(prefix + "title"),
                  what: aeUiText(prefix + "what"),
                  when: aeUiText(prefix + "when"),
                  recommended: aeUiText(prefix + "recommended"),
                  limits: aeUiText(prefix + "limits")
              };
          }

          function showContextHelp(topic) {
              var help = aeHelpCopy(topic);
              alert(
                  "CutBridge — " + help.title + "\n\n" +
                  aeUiText("help_what") + ": " + help.what + "\n\n" +
                  aeUiText("help_when") + ": " + help.when + "\n\n" +
                  aeUiText("help_recommended") + ": " + help.recommended + "\n\n" +
                  aeUiText("help_limits") + ": " + help.limits
              );
          }

          function loadOnly(onLoaded, onError) {
              try {
                  var m = chooseManifest();
                  if (m && onLoaded) onLoaded(m);
                  return m;
              } catch (e) {
                  if (onError) onError(e);
                  alertError(e.toString());
                  return null;
              }
          }

          function buildUI(thisObj) {
              loadLocalePreference();
              var pal = (thisObj instanceof Panel) ? thisObj : new Window("palette", "CutBridge", undefined, {resizeable: true}); if (!pal) return pal;
              pal.orientation = "column"; pal.alignChildren = ["fill", "top"]; pal.spacing = 8; pal.margins = 12;

              var panelStatusKind = state.manifest ? "READY" : "WARNING";
              var panelStatusKey = state.manifest ? "status_package_loaded" : "status_load_prompt";

              var title = pal.add("statictext", undefined, "CutBridge");
              try { title.graphics.font = ScriptUI.newFont(title.graphics.font.name, "BOLD", 16); } catch (e) {}

              var localeRow = pal.add("group");
              localeRow.orientation = "row"; localeRow.alignChildren = ["left", "center"];
              var localeLabel = localeRow.add("statictext", undefined, tr("language_label"));
              var localeSelect = localeRow.add("dropdownlist", undefined, ["日本語", "English"]); localeSelect.selection = currentLocale === "JA" ? 0 : 1;

              var packagePanel = pal.add("panel", undefined, aeUiText("package_section"));
              packagePanel.orientation = "column"; packagePanel.alignChildren = ["fill", "top"]; packagePanel.spacing = 4; packagePanel.margins = 10;
              var packageName = packagePanel.add("statictext", undefined, ""); packageName.characters = 48;
              var packageMeta = packagePanel.add("statictext", undefined, packageStatusText(state.manifest)); packageMeta.characters = 48;
              var statusKind = packagePanel.add("statictext", undefined, ""); statusKind.characters = 48;
              var statusDetail = packagePanel.add("statictext", undefined, "", {multiline: true}); statusDetail.characters = 52; statusDetail.preferredSize.height = 34;

              var actionsPanel = pal.add("panel", undefined, aeUiText("actions_section"));
              actionsPanel.orientation = "column"; actionsPanel.alignChildren = ["fill", "top"]; actionsPanel.spacing = 5; actionsPanel.margins = 10;

              function addAction(buttonText, descriptionKey, helpTopic, handler) {
                  var row = actionsPanel.add("group"); row.orientation = "row"; row.alignChildren = ["fill", "center"];
                  var button = row.add("button", undefined, buttonText); button.alignment = ["fill", "center"];
                  var helpButton = row.add("button", undefined, "?"); helpButton.preferredSize.width = 30;
                  var description = actionsPanel.add("statictext", undefined, aeUiText(descriptionKey), {multiline: true});
                  description.characters = 52; description.preferredSize.height = 34;
                  button.onClick = handler;
                  helpButton.onClick = function() { showContextHelp(helpTopic); };
                  return {button: button, help: helpButton, description: description};
              }

              function statusLabelFor(kind) {
                  if (kind === "ERROR") return aeUiText("status_error");
                  if (kind === "READY") return aeUiText("status_ready");
                  return aeUiText("status_warning");
              }

              function refreshPackagePanel() {
                  var manifest = state.manifest;
                  packagePanel.text = aeUiText("package_section");
                  actionsPanel.text = aeUiText("actions_section");
                  packageName.text = aeUiText("package_label") + ": " + (manifest ? (manifest.package_name || manifest.cut || aeUiText("none")) : aeUiText("none"));
                  packageMeta.text = packageStatusText(manifest);
                  statusKind.text = aeUiText("status_label") + ": " + statusLabelFor(panelStatusKind);
                  statusDetail.text = aeUiText(panelStatusKey);
              }

              function setPanelStatus(kind, key) {
                  panelStatusKind = kind;
                  panelStatusKey = key;
                  refreshPackagePanel();
              }

              var loadAction = addAction(tr("import_package"), "desc_load", "load", function() {
                  loadOnly(
                      function() { setPanelStatus("READY", "status_package_loaded"); },
                      function() { setPanelStatus("ERROR", "status_action_failed"); }
                  );
              });
              var buildAction = addAction(tr("build_comp"), "desc_build", "build", function() {
                  var result = buildComp();
                  if (result && result.success) setPanelStatus("READY", "status_build_complete");
                  else if (result) setPanelStatus("ERROR", "status_action_failed");
              });
              var qcAction = addAction(tr("run_qc"), "desc_qc", "qc", function() {
                  try {
                      var result = runQC(), headline = result && result.report ? String(result.report.headline || "").toUpperCase() : "";
                      if (headline.indexOf("ERROR") >= 0) setPanelStatus("ERROR", "status_qc_error");
                      else if (headline.indexOf("WARNING") >= 0) setPanelStatus("WARNING", "status_qc_warning");
                      else if (result && result.report) setPanelStatus("READY", "status_qc_pass");
                  } catch (e) {
                      setPanelStatus("ERROR", "status_action_failed");
                      alertError(e.toString());
                  }
              });
              var revisionAction = addAction(tr("update_revision"), "desc_revision", "revision", function() {
                  var beforeVersion = state.manifest ? state.manifest.version : null;
                  updateRevision();
                  var afterVersion = state.manifest ? state.manifest.version : null;
                  if (beforeVersion !== null && afterVersion !== null && beforeVersion !== afterVersion) setPanelStatus("READY", "status_revision_complete");
                  else refreshPackagePanel();
              });

              var note = pal.add("statictext", undefined, tr("workflow_note", {version: CutBridgeContract.PRODUCT_VERSION}), {multiline: true}); note.preferredSize.height = 32;

              function refreshLocale() {
                  localeSelect.selection = currentLocale === "JA" ? 0 : 1;
                  localeLabel.text = tr("language_label");
                  loadAction.button.text = tr("import_package"); loadAction.description.text = aeUiText("desc_load");
                  buildAction.button.text = tr("build_comp"); buildAction.description.text = aeUiText("desc_build");
                  qcAction.button.text = tr("run_qc"); qcAction.description.text = aeUiText("desc_qc");
                  revisionAction.button.text = tr("update_revision"); revisionAction.description.text = aeUiText("desc_revision");
                  note.text = tr("workflow_note", {version: CutBridgeContract.PRODUCT_VERSION});
                  refreshPackagePanel();
                  try { pal.layout.layout(true); } catch (layoutError) {}
              }

              localeSelect.onChange = function() {
                  if (!localeSelect.selection) return;
                  saveLocalePreference(localeSelect.selection.index === 0 ? "JA" : "EN");
                  refreshLocale();
              };

              refreshPackagePanel();
              pal.onResizing = pal.onResize = function() { this.layout.resize(); };
              return pal;
          }
'''

          updated = source[:start] + new_block + source[end:]
          if updated == source:
              raise SystemExit('AE UI block replacement produced no change')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Replace S8 ScriptUI runtime test for nested panel/help UX
        shell: bash
        run: |
          cat > tests/ae_s8_native_ui_binding_checks.cjs <<'EOF'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const vm = require('node:vm');

          const root = path.resolve(__dirname, '..');
          const source = fs.readFileSync(path.join(root, 'apps/after-effects/CutBridge.jsx'), 'utf8');
          const Localization = require(path.join(root, 'apps/after-effects/localization.js'));

          function makeRuntime({injectLocalization = true, savedLocale = null} = {}) {
            const controls = [];
            const settingsStore = {};
            const alerts = [];
            if (savedLocale) settingsStore['CutBridge:ui_locale'] = savedLocale;
            let projectMutationCount = 0;

            function attachContainerApi(control) {
              control.add = function(type, unused, textOrItems) {
                return makeControl(type, textOrItems);
              };
              return control;
            }

            function makeControl(type, textOrItems) {
              const control = {
                type,
                text: Array.isArray(textOrItems) ? '' : String(textOrItems == null ? '' : textOrItems),
                items: Array.isArray(textOrItems) ? textOrItems.map((text, index) => ({text, index})) : [],
                graphics: {font: {name: 'Arial'}},
                preferredSize: {},
                alignment: null,
                alignChildren: [],
                orientation: '',
                spacing: 0,
                margins: 0,
                onClick: null,
                onChange: null
              };
              let selection = null;
              Object.defineProperty(control, 'selection', {
                get() { return selection; },
                set(value) {
                  if (typeof value === 'number') selection = control.items[value] || null;
                  else selection = value;
                }
              });
              if (type === 'group' || type === 'panel') attachContainerApi(control);
              controls.push(control);
              return control;
            }

            function Window() {
              this.layout = {resize() {}, layout() {}};
              this.orientation = '';
              this.alignChildren = [];
              this.spacing = 0;
              this.margins = 0;
            }
            Window.prototype.add = function(type, unused, textOrItems) { return makeControl(type, textOrItems); };
            Window.prototype.center = function() {};
            Window.prototype.show = function() {};
            function Panel() {}

            const app = {
              settings: {
                haveSetting(section, key) { return Object.prototype.hasOwnProperty.call(settingsStore, `${section}:${key}`); },
                getSetting(section, key) { return settingsStore[`${section}:${key}`]; },
                saveSetting(section, key, value) { settingsStore[`${section}:${key}`] = String(value); }
              }
            };
            Object.defineProperty(app, 'project', {
              get() { return null; },
              set() { projectMutationCount++; }
            });

            const runtime = {
              Window,
              Panel,
              ScriptUI: {newFont() { return {}; }},
              app,
              alert(message) { alerts.push(String(message)); },
              confirm() { return false; },
              $: {writeln() {}}
            };
            if (injectLocalization) runtime.CutBridgeLocalization = Localization;
            vm.createContext(runtime);
            vm.runInContext(source, runtime);

            return {
              controls,
              alerts,
              settingsStore,
              projectMutationCount: () => projectMutationCount,
              buttonTexts: () => controls.filter((item) => item.type === 'button' && item.text !== '?').map((item) => item.text),
              helpButtons: () => controls.filter((item) => item.type === 'button' && item.text === '?'),
              staticTexts: () => controls.filter((item) => item.type === 'statictext').map((item) => item.text),
              panels: () => controls.filter((item) => item.type === 'panel'),
              dropdown: () => controls.find((item) => item.type === 'dropdownlist')
            };
          }

          {
            const h = makeRuntime();
            const dropdown = h.dropdown();
            assert.ok(dropdown, 'AE panel must expose an explicit locale dropdown');
            assert.equal(dropdown.selection.index, 0, 'Japanese must be selected by default');
            assert.deepEqual(h.buttonTexts(), ['1. パッケージ読み込み', '2. コンポ作成', '3. QC実行', '4. 差し替え']);
            assert.equal(h.helpButtons().length, 4, 'each primary AE action must have contextual ? help');
            assert.equal(h.panels().length, 2, 'beta.2 AE UX must separate package/status from workflow actions');
            assert.ok(h.staticTexts().some((text) => text.includes('状態: 警告 / WARNING')), 'initial status hierarchy must be visible');
            assert.ok(h.staticTexts().some((text) => text.includes('読み込みだけではAEプロジェクトのBuildや変更は行いません')), 'Load description must explain consequence');
            assert.equal(h.projectMutationCount(), 0, 'opening the panel must not mutate project state');

            h.helpButtons()[0].onClick();
            assert.equal(h.alerts.length, 1, 'context help must be available on demand');
            assert.match(h.alerts[0], /パッケージ読み込み/);
            assert.equal(h.projectMutationCount(), 0, 'opening contextual help must not mutate project state');

            dropdown.selection = 1;
            dropdown.onChange();
            assert.deepEqual(h.buttonTexts(), ['1. Import Package', '2. Build Comp', '3. Run QC', '4. Update Revision']);
            assert.equal(h.settingsStore['CutBridge:ui_locale'], 'EN');
            assert.ok(h.staticTexts().some((text) => text.includes('Status: WARNING')), 'English status hierarchy must refresh');
            assert.ok(h.staticTexts().some((text) => text.includes('Loading reads package metadata')), 'English descriptions must refresh');
            assert.equal(h.projectMutationCount(), 0, 'locale switch must remain UX-only');
          }

          {
            const h = makeRuntime({savedLocale: 'EN'});
            assert.equal(h.dropdown().selection.index, 1, 'saved English preference must be restored');
            assert.deepEqual(h.buttonTexts(), ['1. Import Package', '2. Build Comp', '3. Run QC', '4. Update Revision']);
            assert.equal(h.helpButtons().length, 4);
            assert.equal(h.projectMutationCount(), 0);
          }

          {
            const h = makeRuntime({injectLocalization: false});
            assert.equal(h.dropdown().selection.index, 1, 'missing localization sidecar must fall back to English');
            assert.deepEqual(h.buttonTexts(), ['1. Import Package', '2. Build Comp', '3. Run QC', '4. Update Revision']);
            assert.ok(h.staticTexts().some((text) => text.includes('Status: WARNING')));
            assert.equal(h.projectMutationCount(), 0, 'fallback must remain UX-only');
          }

          for (const text of makeRuntime().buttonTexts()) assert.doesNotMatch(text, /\s\/\s/, 'AE UI must not use decorative slash-bilingual primary buttons');

          console.log('S8/beta.2 native ScriptUI binding: PASS (dockable hierarchy, EN/JA descriptions, contextual help, non-mutation)');
          EOF

      - name: Add beta.2 AE UX source contract test
        shell: bash
        run: |
          cat > tests/test_ae_beta2_panel_ux.py <<'EOF'
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SOURCE = (ROOT / 'apps' / 'after-effects' / 'CutBridge.jsx').read_text(encoding='utf-8')

          def test_beta2_ae_panel_has_status_hierarchy_and_context_help():
              assert 'function showContextHelp(topic)' in SOURCE
              assert 'status_ready: "READY"' in SOURCE
              assert 'status_warning: "WARNING"' in SOURCE
              assert 'status_error: "ERROR"' in SOURCE
              assert 'status_ready: "準備完了 / READY"' in SOURCE
              assert 'status_warning: "警告 / WARNING"' in SOURCE
              assert 'status_error: "エラー / ERROR"' in SOURCE
              assert SOURCE.count('row.add("button", undefined, "?")') == 1
              for topic in ('load', 'build', 'qc', 'revision'):
                  assert f'"{topic}"' in SOURCE

          def test_beta2_ae_panel_explains_what_to_do_and_when():
              for key in ('desc_load', 'desc_build', 'desc_qc', 'desc_revision'):
                  assert f'{key}:' in SOURCE
              for suffix in ('_what', '_when', '_recommended', '_limits'):
                  assert f'help_load{suffix}' in SOURCE
                  assert f'help_build{suffix}' in SOURCE
                  assert f'help_qc{suffix}' in SOURCE
                  assert f'help_revision{suffix}' in SOURCE

          def test_panel_open_and_help_are_not_bound_to_build_side_effects():
              tail = SOURCE[SOURCE.index('var panel = buildUI(thisObj);'):]
              assert 'buildComp();' not in tail
              assert 'runQC();' not in tail
              assert 'updateRevision();' not in tail
          EOF

      - name: Add concise AE beta.2 onboarding document
        shell: bash
        run: |
          cat > docs/AE_PANEL_BETA2.md <<'EOF'
          # CutBridge v0.2.3-beta.2 — After Effects Panel Guide

          Status: **candidate documentation / not release authorization**.

          The beta.2 AE panel is designed to answer four questions directly in the UI: **what does this do, when should I use it, what is recommended, and what are the limitations?** Opening the panel or opening contextual help does not build or mutate the AE project.

          ## Package and status

          The top section shows the current package and a simple status state:

          - **READY** — the last inspected action completed successfully for the shown scope.
          - **WARNING** — user review or another setup step is required.
          - **ERROR** — the last action failed or QC+ found a blocking problem.

          The status is guidance, not a substitute for the detailed CutBridge error/QC message and support code.

          ## 1. Load Package

          **What:** reads the Blender-generated `cutbridge.json` and makes that package current in CutBridge.

          **Use it when:** starting a cut or switching to another CutBridge package.

          **Recommended:** choose the exact `cutbridge.json` from the package you intend to composite.

          **Limitation:** loading alone does not import footage, create a comp, or modify artist layers.

          ## 2. Build

          **What:** creates or safely reuses CutBridge-managed folders, footage, layers, and the deterministic comp.

          **Use it when:** a valid package is loaded and required render sequences are available.

          **Recommended:** Build once, then composite normally while keeping artist-authored work separate from CutBridge-managed ownership.

          **Limitation:** CutBridge fails closed on unsafe paths and ambiguous managed ownership rather than guessing.

          ## 3. QC+

          **What:** inspects package identity, sequence completeness, managed ownership, and comp settings without rebuilding the project.

          **Use it when:** after Build, before handoff/delivery, and after meaningful revisions.

          **Recommended:** treat **ERROR** as blocking; inspect **WARNING**; preserve `CBQ-*` support codes when reporting a problem.

          **Limitation:** QC+ reports problems but intentionally does not auto-repair ambiguous ownership or missing production content.

          ## 4. Revision

          **What:** updates compatible CutBridge-managed sources and metadata from a newer package while preserving artist-owned work covered by the revision contract.

          **Use it when:** moving through a normal `V001 -> V002 -> V003` Blender package revision.

          **Recommended:** save the AE project first, select the newer package, review warnings, then confirm the expected revision.

          **Limitation:** unsupported FPS, resolution, duration, pass-set, or ownership changes are blocked or require deliberate rebuild/migration.

          ## Current release boundary

          The panel remains a dockable ScriptUI Panel/palette. This beta.2 repair improves hierarchy, descriptions, contextual help, and status feedback. Native-host verification on the exact frozen candidate is still required before expanding any compatibility or release claim.
          EOF

      - name: Include AE beta.2 UX contract in static CI subset
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          needle = 'tests/test_ae_package_identity.py\n'
          replacement = 'tests/test_ae_package_identity.py tests/test_ae_beta2_panel_ux.py\n'
          if needle not in text:
              raise SystemExit('CI pytest subset anchor not found')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Run bounded AE repair validation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest jsonschema
          cp apps/after-effects/CutBridge.jsx /tmp/CutBridge.js
          node --check /tmp/CutBridge.js
          node tests/ae_s8_native_ui_binding_checks.cjs
          pytest -q tests/test_ae_beta2_panel_ux.py tests/test_ae_s8.py tests/test_ae_contract.py tests/test_ae_install_docs.py

      - name: Commit repair to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CutBridge CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/after-effects/CutBridge.jsx tests/ae_s8_native_ui_binding_checks.cjs tests/test_ae_beta2_panel_ux.py docs/AE_PANEL_BETA2.md .github/workflows/ci.yml
          git commit -m "feat: improve AE beta.2 panel guidance and status UX"
          git push origin HEAD:fix/beta2-line-preflight-ux
