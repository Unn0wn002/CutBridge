name: Beta2 AE UI Repair Orchestrator

on:
  push:
    branches:
      - build/beta2-ae-ui-repair

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout orchestrator payload
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: build/beta2-ae-ui-repair
          path: orchestrator
          persist-credentials: false

      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/beta2-line-preflight-ux
          path: repair
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded AE UI repair
        working-directory: repair
        run: python ../orchestrator/orchestration/apply_beta2_ae_ui_repair.py

      - name: Validate repaired AE UI
        working-directory: repair
        run: |
          python -m pip install --disable-pip-version-check pytest jsonschema
          cp apps/after-effects/CutBridge.jsx /tmp/CutBridge.js
          node --check /tmp/CutBridge.js
          node tests/ae_s8_native_ui_binding_checks.cjs
          pytest -q tests/test_ae_beta2_panel_ux.py tests/test_ae_s8.py tests/test_ae_contract.py tests/test_ae_install_docs.py

      - name: Commit repair to PR branch
        working-directory: repair
        run: |
          git config user.name "CutBridge CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/after-effects/CutBridge.jsx tests/ae_s8_native_ui_binding_checks.cjs tests/test_ae_beta2_panel_ux.py docs/AE_PANEL_BETA2.md .github/workflows/ci.yml
          git commit -m "feat: improve AE beta.2 panel guidance and status UX"
          git push origin HEAD:fix/beta2-line-preflight-ux
