name: S7 native defect repair gate

on:
  push:
    branches:
      - feature/session-7-qc-plus

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.event.head_commit.message == 'chore: add S7 native repair gate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact native-AE repairs and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          qc = Path('apps/after-effects/qc_plus.js')
          text = qc.read_text(encoding='utf-8')
          old = '    var SCOPE_ORDER = {\n        package: 0,\n'
          new = '    var SCOPE_ORDER = {\n        "package": 0,\n'
          assert text.count(old) == 1, 'qc_plus.js reserved-key anchor changed'
          qc.write_text(text.replace(old, new, 1), encoding='utf-8')

          rev = Path('apps/after-effects/revision_manager.js')
          text = rev.read_text(encoding='utf-8')
          old = '        return {status: errors.length ? "incompatible" : warnings.length ? "warning" : "safe",\n            reasons: errors, warnings: warnings};\n'
          new = '''        var status;\n        if (errors.length > 0) {\n            status = "incompatible";\n        } else if (warnings.length > 0) {\n            status = "warning";\n        } else {\n            status = "safe";\n        }\n        return {status: status, reasons: errors, warnings: warnings};\n'''
          assert text.count(old) == 1, 'revision_manager.js status anchor changed'
          rev.write_text(text.replace(old, new, 1), encoding='utf-8')

          regression = Path('tests/ae_s7_native_ae_regressions.cjs')
          regression.write_text(r'''const assert = require("node:assert/strict");
const fs = require("node:fs");
const path = require("node:path");
const R = require("../apps/after-effects/revision_manager.js");

const root = path.resolve(__dirname, "..");
const qcSource = fs.readFileSync(path.join(root, "apps/after-effects/qc_plus.js"), "utf8");
const revisionSource = fs.readFileSync(path.join(root, "apps/after-effects/revision_manager.js"), "utf8");

// Native AE 26.3 ExtendScript rejects an unquoted `package` object key.
assert.match(qcSource, /var SCOPE_ORDER = \{\s*"package": 0,/);
assert.doesNotMatch(qcSource, /var SCOPE_ORDER = \{\s*package: 0,/);

// Native ExtendScript evaluated the previous nested ternary incorrectly for errors=1/warnings=0.
// Keep this decision branch explicit and parser-safe.
assert.match(revisionSource, /if \(errors\.length > 0\) \{\s*status = "incompatible";/);
assert.match(revisionSource, /else if \(warnings\.length > 0\) \{\s*status = "warning";/);
assert.doesNotMatch(revisionSource, /errors\.length \? "incompatible" : warnings\.length \? "warning" : "safe"/);

function manifest(version, overrides) {
    const base = {
        schema: "cutbridge-manifest",
        schema_version: 1,
        cutbridge_version: "0.2.3",
        package_name: "PROJECT_A_EP01_SC010_C012_T01_V" + String(version).padStart(3, "0"),
        project: "PROJECT_A",
        episode: "EP01",
        scene: "SC010",
        cut: "C012",
        take: "T01",
        version,
        fps: 24,
        frames: {start: 1, end: 24, count: 24},
        resolution: {width: 1920, height: 1080, pixel_aspect: 1},
        passes: [{name: "BEAUTY", path: "BEAUTY", sequence_pattern: "BEAUTY_####.png", required: true}]
    };
    return Object.assign(base, overrides || {});
}

const fpsAssessment = R.assess(manifest(2), manifest(3, {fps: 30}));
assert.equal(fpsAssessment.status, "incompatible");
assert.ok(fpsAssessment.reasons.includes("FPS changes are unsupported."));
assert.equal(fpsAssessment.warnings.length, 0);

const safeAssessment = R.assess(manifest(2), manifest(3));
assert.equal(safeAssessment.status, "safe");

const warningPasses = [
    {name: "BEAUTY", path: "BEAUTY", sequence_pattern: "BEAUTY_####.png", required: false}
];
const warningAssessment = R.assess(manifest(2), manifest(3, {passes: warningPasses}));
assert.equal(warningAssessment.status, "warning");
assert.equal(warningAssessment.reasons.length, 0);
assert.ok(warningAssessment.warnings.length > 0);

console.log("S7 native AE regressions: PASS (ExtendScript reserved key + explicit revision status + FPS guard)");
''', encoding='utf-8')

          py = Path('tests/test_ae_s7.py')
          text = py.read_text(encoding='utf-8')
          anchor = '''def test_s7_native_qc_plus_binding():\n    node = shutil.which("node")\n    assert node, "Node is required for S7 native QC+ binding regressions"\n    root = Path(__file__).resolve().parents[1]\n    subprocess.run([node, str(root / "tests" / "ae_s7_native_qc_binding_checks.cjs")], cwd=root, check=True)\n\n\n'''
          addition = anchor + '''def test_s7_native_after_effects_runtime_regressions():\n    node = shutil.which("node")\n    assert node, "Node is required for S7 native After Effects regression guards"\n    root = Path(__file__).resolve().parents[1]\n    subprocess.run([node, str(root / "tests" / "ae_s7_native_ae_regressions.cjs")], cwd=root, check=True)\n\n\n'''
          assert text.count(anchor) == 1, 'test_ae_s7.py insertion anchor changed'
          py.write_text(text.replace(anchor, addition, 1), encoding='utf-8')
          PY

      - name: Parser and focused regression gate
        shell: bash
        run: |
          node --check apps/after-effects/qc_plus.js
          node --check apps/after-effects/revision_manager.js
          node tests/ae_s7_native_ae_regressions.cjs
          node tests/ae_s6_revision_checks.cjs
          node tests/ae_s7_qc_plus_checks.cjs
          node tests/ae_s7_native_qc_binding_checks.cjs
          python -m pytest -q tests/test_ae_s7.py

      - name: Commit only verified product/test repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/after-effects/qc_plus.js apps/after-effects/revision_manager.js tests/ae_s7_native_ae_regressions.cjs tests/test_ae_s7.py
          git diff --cached --check
          git commit -m "fix: repair S7 native After Effects regressions"
          git push origin HEAD:feature/session-7-qc-plus
