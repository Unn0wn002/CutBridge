name: S7 native defect repair gate

on:
  push:
    branches:
      - feature/session-7-qc-plus

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply idempotent native-AE repairs
        run: python tools/s7_native_repair.py

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Run focused regression gate
        run: |
          node --check apps/after-effects/qc_plus.js
          node --check apps/after-effects/revision_manager.js
          node tests/ae_s6_revision_checks.cjs
          node tests/ae_s7_qc_plus_checks.cjs
          node tests/ae_s7_native_qc_binding_checks.cjs
          python -m pytest -q tests/test_ae_s7.py

      - name: Commit verified repairs when needed
        shell: bash
        run: |
          git add apps/after-effects/qc_plus.js apps/after-effects/revision_manager.js tests/test_ae_s7.py
          if git diff --cached --quiet; then
            echo "No product repair changes to commit."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: repair S7 native After Effects regressions"
          git push origin HEAD:feature/session-7-qc-plus
