name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest jsonschema
      - name: Run tests
        run: pytest -q tests/test_static.py tests/test_release_hygiene.py tests/test_release_authorization.py tests/test_ae_contract.py tests/test_ae_s5.py tests/test_ae_s6.py tests/test_ae_s7.py tests/test_ae_s8.py tests/test_s8_blender_localization.py tests/test_studio_presets.py tests/test_camera_handoff_contract.py tests/test_handoff_3d_schema.py tests/test_ae_install_docs.py tests/test_ae_package_identity.py
      - name: Simulate release packaging
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import tomllib
          with open('apps/blender/cutbridge/blender_manifest.toml', 'rb') as fh:
              print(tomllib.load(fh)['version'])
          PY
          )"
          python tools/build_release.py --tag "v${VERSION}" --output dist-ci
          test -f "dist-ci/CutBridge-Blender-v${VERSION}.zip"
          test -f "dist-ci/CutBridge-AfterEffects-v${VERSION}.zip"
          test -f dist-ci/SHA256SUMS.txt
          test -f dist-ci/release-metadata.json
          (cd dist-ci && sha256sum --check SHA256SUMS.txt)

      - name: Run S6 revision contract checks
        run: |
          node tests/ae_s6_revision_checks.cjs
          node tests/ae_s6_optional_pass_lifecycle_checks.cjs
          node tests/ae_s6_extend_script_binding_checks.cjs
      - name: Run S7 QC+ diagnostic checks
        run: |
          node tests/ae_s7_qc_plus_checks.cjs
          node tests/ae_s7_native_qc_binding_checks.cjs
      - name: Run S8 localization checks
        run: |
          node tests/ae_s8_localization_checks.cjs
          node tests/ae_s8_native_ui_binding_checks.cjs
      - name: Run S10C reconstruction checks
        run: |
          node tests/ae_s10c_reconstruction_checks.cjs
      - name: Run S13 3D revision native-host regression
        run: |
          node tests/ae_s13_revision_3d_tag_migration_checks.cjs
      - name: Check ExtendScript syntax with Node parser
        run: |
          cp apps/after-effects/CutBridge.jsx /tmp/CutBridge.js
          cp apps/after-effects/revision_manager.js /tmp/revision_manager.js
          cp apps/after-effects/qc_plus.js /tmp/qc_plus.js
          cp apps/after-effects/localization.js /tmp/localization.js
          node --check /tmp/CutBridge.js
          node --check /tmp/revision_manager.js
          node --check /tmp/qc_plus.js
          node --check /tmp/localization.js

      - name: Stage artifact-action smoke file
        run: cp dist-ci/SHA256SUMS.txt /tmp/cutbridge-actions-smoke.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cutbridge-actions-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/cutbridge-actions-smoke.txt
          if-no-files-found: error
          retention-days: 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cutbridge-actions-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact-smoke
      - name: Verify CI artifact-action round trip
        run: cmp dist-ci/SHA256SUMS.txt artifact-smoke/cutbridge-actions-smoke.txt

  blender-52-rna-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install Blender integration test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema bpy==5.2.1
      - name: Register, unregister, and re-register CutBridge in Blender RNA
        run: python tests/test_blender_runtime_52.py
      - name: Run the complete suite including Blender package integration
        run: pytest -q
