name: S8 Native Defect Repair Gate

on:
  push:
    branches: ['feature/session-8-japanese-first-ux']
    paths:
      - '.github/workflows/s8-native-defect-repair.yml'
      - 'tools/s8_native_defect_repair.py'

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/session-8-japanese-first-ux
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install pytest jsonschema
      - name: Apply exact native-defect repairs
        run: python tools/s8_native_defect_repair.py
      - name: Verify focused S8 and legacy contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_s8_blender_localization.py tests/test_ae_s8.py tests/test_ae_s7.py tests/test_ae_s6.py tests/test_release_hygiene.py
          node tests/ae_s8_localization_checks.cjs
          node tests/ae_s8_native_ui_binding_checks.cjs
          node tests/ae_s7_qc_plus_checks.cjs
          node tests/ae_s7_native_qc_binding_checks.cjs
          node tests/ae_s6_revision_checks.cjs
          cp apps/after-effects/CutBridge.jsx /tmp/CutBridge.js
          node --check /tmp/CutBridge.js
          node --check apps/after-effects/localization.js
          git diff --check
      - name: Commit verified product/test repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MwoaMwoa'
          git config user.email '129099303+Unn0wn002@users.noreply.github.com'
          git add apps/blender/cutbridge/ui.py apps/after-effects/CutBridge.jsx tests/ae_s8_native_ui_binding_checks.cjs tests/test_s8_blender_localization.py
          git diff --cached --quiet && { echo 'No repair diff produced'; exit 1; }
          git commit -m 'fix: repair S8 native localization UX defects'
          git push origin HEAD:feature/session-8-japanese-first-ux
