name: Integrate native-validated JSX guard

on:
  push:
    branches: [feature/session-6-revision-manager]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/session-6-revision-manager
          fetch-depth: 0
      - name: Apply exact native-validated JSX pass-set guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('apps/after-effects/CutBridge.jsx')
          source = path.read_text(encoding='utf-8')
          if 'function directRevisionPassSetErrors(current, candidate)' in source:
              raise SystemExit('CutBridge.jsx is already patched; refusing a second application')

          guard = '''    // S6 JSX-native pass-set guard: intentionally independent of revision_manager.js host binding.\n    // This executes inside CutBridge.jsx before the revision confirmation UI can be reached.\n    function directRevisionPassSetErrors(current, candidate) {\n        var reasons = [], currentNames = {}, candidateNames = {}, i, p, key;\n        if (!current || !candidate || !current.passes || !candidate.passes) {\n            return ["Revision pass-set guard could not inspect the current/candidate manifests."];\n        }\n        for (i = 0; i < current.passes.length; i++) {\n            p = current.passes[i];\n            if (!p || typeof p.name !== "string") return ["Revision pass-set guard found an invalid current pass."];\n            currentNames["$" + p.name] = p;\n        }\n        for (i = 0; i < candidate.passes.length; i++) {\n            p = candidate.passes[i];\n            if (!p || typeof p.name !== "string") return ["Revision pass-set guard found an invalid candidate pass."];\n            candidateNames["$" + p.name] = p;\n        }\n        for (i = 0; i < current.passes.length; i++) {\n            p = current.passes[i]; key = "$" + p.name;\n            if (!candidateNames[key]) {\n                if (p.required !== false) reasons.push("Previously required pass missing: " + p.name);\n                else reasons.push("Removing an optional pass is unsupported by source-only revision: " + p.name + ". Rebuild or migrate the comp deliberately.");\n            }\n        }\n        for (i = 0; i < candidate.passes.length; i++) {\n            p = candidate.passes[i]; key = "$" + p.name;\n            if (!currentNames[key]) reasons.push("Adding passes is unsupported by source-only revision: " + p.name);\n        }\n        return reasons;\n    }\n'''
          function_marker = '    function updateRevision() {\n'
          if source.count(function_marker) != 1:
              raise SystemExit(f'Expected one updateRevision marker; found {source.count(function_marker)}')
          source = source.replace(function_marker, guard + function_marker, 1)

          manager_line = '            var manager = getRevisionManager(), assessment = manager.assess(state.manifest, selected.manifest);\n'
          guard_call = '            var passSetReasons = directRevisionPassSetErrors(state.manifest, selected.manifest);\n            if (passSetReasons.length) { alertError("Revision blocked:\\n- " + passSetReasons.join("\\n- ")); return; }\n'
          if source.count(manager_line) != 1:
              raise SystemExit(f'Expected one manager assess line; found {source.count(manager_line)}')
          patched = source.replace(manager_line, guard_call + manager_line, 1)

          payload = patched.encode('utf-8')
          blob_sha = hashlib.sha1(f'blob {len(payload)}\0'.encode() + payload).hexdigest()
          expected = '2acf04c0d7f821bb3c8ef5f88277266af35c116c'
          if blob_sha != expected:
              raise SystemExit(f'Patched JSX blob mismatch: {blob_sha} != {expected}')
          path.write_text(patched, encoding='utf-8', newline='')
          print(f'Native-tested CutBridge.jsx blob verified: {blob_sha}')
          PY
      - name: Syntax and guard-order smoke
        shell: bash
        run: |
          cp apps/after-effects/CutBridge.jsx /tmp/CutBridge.js
          node --check /tmp/CutBridge.js
          node --check apps/after-effects/revision_manager.js
          python - <<'PY'
          from pathlib import Path
          s = Path('apps/after-effects/CutBridge.jsx').read_text(encoding='utf-8')
          u = s[s.index('function updateRevision()'):]
          assert u.index('directRevisionPassSetErrors(state.manifest, selected.manifest)') < u.index('getRevisionManager()') < u.index('confirm(message)')
          print('JSX guard order: PASS')
          PY
      - name: Remove one-shot workflow and commit source integration
        shell: bash
        run: |
          rm .github/workflows/integrate-native-jsx-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/after-effects/CutBridge.jsx .github/workflows/integrate-native-jsx-guard.yml
          git commit -m "Integrate native-validated JSX pass-set gate"
          git push origin HEAD:feature/session-6-revision-manager
