name: Temporary Issue 21 Patch

on:
  push:
    branches: ['fix/s6-package-identity']

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Apply exact package identity guard
        run: python tools/issue21_patch.py
      - name: Verify bounded repair before commit
        run: |
          set -euo pipefail
          node tests/ae_package_identity_checks.cjs
          cp apps/after-effects/CutBridge.jsx /tmp/CutBridge.js
          node --check /tmp/CutBridge.js
          git diff --check
          git diff -- apps/after-effects/CutBridge.jsx
      - name: Commit verified repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/after-effects/CutBridge.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: bind AE package name to logical identity'
          git push origin HEAD:fix/s6-package-identity
