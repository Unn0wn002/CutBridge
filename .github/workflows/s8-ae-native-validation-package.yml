name: S8 Repaired AE Native Validation Package

on:
  push:
    branches: ['validation/s8-native-f477b745']
    paths:
      - '.github/workflows/s8-ae-native-validation-package.yml'

permissions:
  contents: read

jobs:
  build-exact-ae-validation-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: f477b745cc600b85708b63d059d6c4eaed9f0249
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build exact repaired S8 AE validation package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'f477b745cc600b85708b63d059d6c4eaed9f0249'
          python tools/build_release.py --tag v0.2.3 --output dist-native-ae
          AE_ZIP='dist-native-ae/CutBridge-AfterEffects-v0.2.3.zip'
          EXPECTED='553061247adedac95e8a3883a45ac1727636263e85c8a74d2b575aeff121e502'
          ACTUAL="$(sha256sum "$AE_ZIP" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          printf '%s  %s\n' "$ACTUAL" 'CutBridge-AfterEffects-v0.2.3.zip' > dist-native-ae/AE-SHA256.txt
          python - <<'PY'
          import zipfile
          from pathlib import Path
          path = Path('dist-native-ae/CutBridge-AfterEffects-v0.2.3.zip')
          expected = ['CutBridge.jsx','revision_manager.js','qc_plus.js','localization.js','INSTALL.md','LICENSE']
          with zipfile.ZipFile(path) as archive:
              assert archive.namelist() == expected, archive.namelist()
          PY
          cat > dist-native-ae/NATIVE_VALIDATION.txt <<'EOF'
          CutBridge S8 repaired After Effects native validation artifact
          Source commit: f477b745cc600b85708b63d059d6c4eaed9f0249
          After Effects ZIP SHA-256: 553061247adedac95e8a3883a45ac1727636263e85c8a74d2b575aeff121e502
          Validation gate: GitHub Issue #38
          Repairs under retest: persisted-JA missing-localization fallback coherence plus localization sanity.
          This artifact is not a release and does not authorize publication.
          EOF
      - name: Upload exact repaired AE validation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CutBridge-S8-AE-f477b745-native-validation
          path: |
            dist-native-ae/CutBridge-AfterEffects-v0.2.3.zip
            dist-native-ae/AE-SHA256.txt
            dist-native-ae/release-metadata.json
            dist-native-ae/NATIVE_VALIDATION.txt
          if-no-files-found: error
          retention-days: 30
