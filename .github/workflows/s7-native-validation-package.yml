name: S7 Native Validation Package

on:
  push:
    branches: ['validation/s7-native-b17b9d3c']
    paths:
      - '.github/workflows/s7-native-validation-package.yml'

permissions:
  contents: read

jobs:
  build-exact-ae-validation-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: b17b9d3cd5b67d7bfd3741a58df403d5946e2327
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build exact S7 validation package
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_release.py --tag v0.2.3 --output dist-native
          AE_ZIP='dist-native/CutBridge-AfterEffects-v0.2.3.zip'
          EXPECTED='1131c10d76b456afb33dc6fcd6e81078191352458faf03c824d895e52f8e6a8c'
          ACTUAL="$(sha256sum "$AE_ZIP" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          printf '%s  %s\n' "$ACTUAL" 'CutBridge-AfterEffects-v0.2.3.zip' > dist-native/AE-SHA256.txt
          cat > dist-native/NATIVE_VALIDATION.txt <<'EOF'
          CutBridge S7 native validation artifact
          Source commit: b17b9d3cd5b67d7bfd3741a58df403d5946e2327
          After Effects ZIP SHA-256: 1131c10d76b456afb33dc6fcd6e81078191352458faf03c824d895e52f8e6a8c
          Validation gate: GitHub Issue #36
          Purpose: real Adobe After Effects desktop validation only.
          This artifact is not a release and does not authorize publication.
          EOF
      - name: Upload exact After Effects validation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CutBridge-S7-AE-b17b9d3c-native-validation
          path: |
            dist-native/CutBridge-AfterEffects-v0.2.3.zip
            dist-native/AE-SHA256.txt
            dist-native/release-metadata.json
            dist-native/NATIVE_VALIDATION.txt
          if-no-files-found: error
          retention-days: 30
