name: S8 Repaired Blender Native Validation Package

on:
  push:
    branches: ['validation/s8-native-f477b745']
    paths:
      - '.github/workflows/s8-blender-native-validation-package.yml'

permissions:
  contents: read

jobs:
  build-exact-blender-validation-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: f477b745cc600b85708b63d059d6c4eaed9f0249
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build exact repaired S8 Blender validation package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'f477b745cc600b85708b63d059d6c4eaed9f0249'
          python tools/build_release.py --tag v0.2.3 --output dist-native-blender
          BLENDER_ZIP='dist-native-blender/CutBridge-Blender-v0.2.3.zip'
          EXPECTED='476ad20ed251c3f068d6e8757d84be6ea2f492b7fc789cb89806784d4a7ea5ae'
          ACTUAL="$(sha256sum "$BLENDER_ZIP" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          printf '%s  %s\n' "$ACTUAL" 'CutBridge-Blender-v0.2.3.zip' > dist-native-blender/BLENDER-SHA256.txt
          python - <<'PY'
          import zipfile
          from pathlib import Path
          path = Path('dist-native-blender/CutBridge-Blender-v0.2.3.zip')
          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())
              required = {'blender_manifest.toml','__init__.py','properties.py','ui.py','operators.py','localization.py','LICENSE'}
              missing = required - names
              assert not missing, sorted(missing)
          PY
          cat > dist-native-blender/NATIVE_VALIDATION.txt <<'EOF'
          CutBridge S8 repaired Blender native validation artifact
          Source commit: f477b745cc600b85708b63d059d6c4eaed9f0249
          Blender ZIP SHA-256: 476ad20ed251c3f068d6e8757d84be6ea2f492b7fc789cb89806784d4a7ea5ae
          Validation gate: GitHub Issue #41
          Repairs under retest: practical narrow N-panel layout/readability plus JA/EN sanity.
          This artifact is not a release and does not authorize publication.
          EOF
      - name: Upload exact repaired Blender validation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CutBridge-S8-Blender-f477b745-native-validation
          path: |
            dist-native-blender/CutBridge-Blender-v0.2.3.zip
            dist-native-blender/BLENDER-SHA256.txt
            dist-native-blender/release-metadata.json
            dist-native-blender/NATIVE_VALIDATION.txt
          if-no-files-found: error
          retention-days: 30
