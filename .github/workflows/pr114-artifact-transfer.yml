name: PR114 fixed artifact transfer

# Transport only. No checkout, candidate imports, tests, builds or publication.
# The original validated workflow and artifact remain immutable.
on:
  push:
    branches: ['build/pr114-artifact-transfer-20261021']

permissions:
  actions: read
  contents: read

jobs:
  fixed-artifact-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve fixed existing artifact and emit hash-bound package chunks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import base64, hashlib, io, json, os, re, urllib.request, zipfile
          expected = '04ef1fe67cd580200c4af6604c825680986745e4f56fc8184455166a566014cd'
          url = 'https://api.github.com/repos/Unn0wn002/CutBridge/actions/artifacts/12334183017/zip'
          # Do not forward the GitHub bearer token to the signed storage redirect.
          class SameHostRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  new = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if new is not None:
                      new.remove_header('Authorization')
                  return new
          opener = urllib.request.build_opener(SameHostRedirect())
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'CutBridge-fixed-artifact-transfer'})
          with opener.open(req, timeout=60) as response:
              data = response.read(32 * 1024 * 1024 + 1)
          assert len(data) == 12366041 and hashlib.sha256(data).hexdigest() == expected, 'fixed outer identity mismatch'
          required = {
              'CutBridge-AfterEffects-v0.2.5.zip': '5363795c66b1fbb664444fd5346ca9532d99822ce2cf3315193d4abec1789b9c',
              'CutBridge-Blender-v0.2.5.zip': '864131a58a1c56e4364c3e435ef1433fbda415515be7292770212bfdc4c31bfe',
          }
          with zipfile.ZipFile(io.BytesIO(data)) as outer:
              names = outer.namelist()
              assert len(set(names)) == len(names) and outer.testzip() is None
              for name in names:
                  assert not name.startswith('/') and '\\' not in name and ':' not in name and '..' not in name.split('/')
              print('CB114_OUTER ' + expected + ' ' + str(len(data)))
              # Emit existing text evidence as data alongside the four release assets.
              selected = ['verification.json', 'bootstrap-context.json', 'evidence.sha256', 'bootstrap-context.sha256',
                          'dist-ci-inventory.json', 'dist-repeat-inventory.json', 'repeated-package-inventory.json']
              selected += ['candidate-output/dist-ci/' + name for name in list(required) + ['release-metadata.json', 'SHA256SUMS.txt']]
              for path in selected:
                  assert path in names, 'expected fixed artifact member absent: ' + path
                  content = outer.read(path)
                  assert len(content) < 2 * 1024 * 1024
                  leaf = path.rsplit('/', 1)[-1]
                  if leaf in required:
                      assert hashlib.sha256(content).hexdigest() == required[leaf]
                      with zipfile.ZipFile(io.BytesIO(content)) as nested:
                          assert nested.testzip() is None
                      assert content == outer.read(path.replace('/dist-ci/', '/dist-repeat/'))
                  encoded = base64.b64encode(content).decode('ascii')
                  chunks = [encoded[n:n+4096] for n in range(0, len(encoded), 4096)]
                  print('CB114_FILE ' + leaf + ' ' + str(len(content)) + ' ' + hashlib.sha256(content).hexdigest() + ' ' + str(len(chunks)))
                  for n, chunk in enumerate(chunks):
                      print('CB114_CHUNK ' + leaf + ' ' + str(n) + ' ' + chunk)
              print('CB114_TRANSFER_COMPLETE; no candidate execution or native acceptance')
          PY
